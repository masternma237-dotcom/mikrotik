<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; object-src 'none'; base-uri 'self';" />
  <title>MikroTik Config Guide — CFP-CMD</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome (SRI à épingler après téléchargement local ; crossorigin déjà actif) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />

  <!-- Highlight.js (SRI à épingler après téléchargement local ; crossorigin déjà actif) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" crossorigin="anonymous" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" crossorigin="anonymous" defer></script>

  <style>
    /* ─── CSS VARIABLES ─────────────────────────────────────────────── */
    :root {
      --bg-base:      #08111f;
      --bg-surface:   #0d1e35;
      --bg-card:      #102240;
      --bg-elevated:  #152d52;
      --border:       #1e3a5f;
      --border-glow:  #2a5080;
      --txt-primary:  #e8f4fd;
      --txt-secondary:#8badc8;
      --txt-muted:    #4d7494;
      --accent:       #f39c12;
      --accent-dim:   #b8750d;
      --accent-glow:  rgba(243,156,18,0.15);
      --green:        #27ae60;
      --red:          #e74c3c;
      --blue:         #3498db;
      --cyan:         #00bcd4;
      --code-bg:      #060e1a;
      --sidebar-w:    260px;
      --glossary-w:   240px;
      --header-h:     60px;
      --radius:       8px;
      --shadow:       0 4px 24px rgba(0,0,0,0.5);
      --transition:   0.2s ease;
    }

    [data-theme="light"] {
      --bg-base:      #f0f4f8;
      --bg-surface:   #ffffff;
      --bg-card:      #f8fafc;
      --bg-elevated:  #e8f0f8;
      --border:       #c5d8ec;
      --border-glow:  #90b8d8;
      --txt-primary:  #0b2040;
      --txt-secondary:#3a6080;
      --txt-muted:    #7a9ab8;
      --accent:       #d4860a;
      --accent-dim:   #a06008;
      --accent-glow:  rgba(212,134,10,0.1);
      --code-bg:      #1a2535;
      --shadow:       0 4px 24px rgba(0,50,100,0.12);
    }

    /* ─── RESET & BASE ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg-base);
      color: var(--txt-primary);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── HEADER ─────────────────────────────────────────────────────── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      z-index: 200;
      box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }

    /* ─── Skip-link accessibilité ────────────────────────────────────── */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: #000;
      padding: 10px 16px;
      font-weight: 700;
      z-index: 999;
      border-radius: 0 0 8px 0;
    }

    .skip-link:focus { left: 0; }

    /* ─── Focus clavier visible ──────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      color: #000;
      font-weight: 800;
    }

    .logo-text {
      font-family: 'Exo 2', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: var(--txt-primary);
      letter-spacing: 0.03em;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-top: -3px;
    }

    .header-search {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .header-search input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--txt-primary);
      padding: 8px 36px 8px 14px;
      border-radius: var(--radius);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .header-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .header-search input::placeholder { color: var(--txt-muted); }

    .search-icon {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--txt-muted);
      font-size: 13px;
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .btn-icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--txt-secondary);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 15px;
    }

    .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .btn-pdf {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      height: 36px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .btn-pdf:hover { background: var(--accent-dim); transform: translateY(-1px); }

    #mobile-menu-btn { display: none; }

    /* ─── PROGRESS BAR ───────────────────────────────────────────────── */
    #progress-bar-container {
      position: fixed;
      top: var(--header-h); left: 0; right: 0;
      height: 3px;
      background: var(--bg-elevated);
      z-index: 199;
    }

    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #e67e22);
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--accent);
    }

    /* ─── LAYOUT ─────────────────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--glossary-w);
      grid-template-rows: 1fr;
      margin-top: calc(var(--header-h) + 3px);
      min-height: calc(100vh - var(--header-h) - 3px);
    }

    /* ─── LEFT SIDEBAR ───────────────────────────────────────────────── */
    #sidebar {
      position: sticky;
      top: calc(var(--header-h) + 3px);
      height: calc(100vh - var(--header-h) - 3px);
      overflow-y: auto;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-track { background: transparent; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-label {
      font-family: 'Exo 2', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--txt-muted);
      padding: 0 16px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all var(--transition);
      font-size: 13.5px;
      color: var(--txt-secondary);
      position: relative;
    }

    .nav-item:hover {
      background: var(--bg-card);
      color: var(--txt-primary);
      border-left-color: var(--border-glow);
    }

    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    .nav-item.visited:not(.active)::after {
      content: '';
      position: absolute;
      right: 12px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.7;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .nav-step {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      background: var(--bg-elevated);
      color: var(--txt-muted);
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .nav-item.active .nav-step {
      background: var(--accent);
      color: #000;
    }

    /* ─── MAIN CONTENT ───────────────────────────────────────────────── */
    #main {
      overflow-y: auto;
      background: var(--bg-base);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #main::-webkit-scrollbar { width: 6px; }
    #main::-webkit-scrollbar-track { background: transparent; }
    #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .content-wrapper {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 32px 60px;
    }

    /* ─── SECTION HEADER ─────────────────────────────────────────────── */
    .section-header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .section-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-glow);
      border: 1px solid var(--accent-dim);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Exo 2', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--txt-primary);
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .section-description {
      color: var(--txt-secondary);
      font-size: 15px;
      line-height: 1.7;
    }

    /* ─── CARDS ──────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    .card-header-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .icon-cli { background: rgba(39,174,96,0.15); color: var(--green); }
    .icon-winbox { background: rgba(52,152,219,0.15); color: var(--blue); }
    .icon-diagram { background: rgba(243,156,18,0.15); color: var(--accent); }
    .icon-concept { background: rgba(0,188,212,0.15); color: var(--cyan); }

    .card-header-title {
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card-body { padding: 16px; }

    /* ─── CLI BLOCKS ─────────────────────────────────────────────────── */
    .cli-block {
      position: relative;
      margin-bottom: 10px;
    }

    .cli-block:last-child { margin-bottom: 0; }

    .cli-code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 50px 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #abb2bf;
      overflow-x: auto;
      white-space: pre;
    }

    .cli-copy-btn {
      position: absolute;
      top: 8px; right: 8px;
      width: 30px; height: 30px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--txt-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      transition: all var(--transition);
    }

    .cli-copy-btn:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    .cli-copy-btn.copied {
      background: rgba(39,174,96,0.2);
      border-color: var(--green);
      color: var(--green);
    }

    .cli-all-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 7px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--txt-secondary);
      font-size: 13px;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      transition: all var(--transition);
    }

    .cli-all-btn:hover {
      border-color: var(--green);
      color: var(--green);
      background: rgba(39,174,96,0.08);
    }

    /* ─── WINBOX STEPS ───────────────────────────────────────────────── */
    .winbox-steps {
      list-style: none;
      counter-reset: wb-step;
    }

    .winbox-steps li {
      counter-increment: wb-step;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--bg-elevated);
      font-size: 14px;
      color: var(--txt-secondary);
    }

    .winbox-steps li:last-child { border-bottom: none; }

    .winbox-steps li::before {
      content: counter(wb-step);
      min-width: 22px; height: 22px;
      background: rgba(52,152,219,0.15);
      border: 1px solid rgba(52,152,219,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--blue);
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .wb-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--bg-elevated);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--cyan);
      white-space: nowrap;
    }

    /* ─── DIAGRAM PLACEHOLDER ────────────────────────────────────────── */
    .diagram-placeholder {
      background: var(--bg-card);
      border: 1px dashed var(--border-glow);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .diagram-placeholder svg { opacity: 0.9; }
    .diagram-placeholder p { color: var(--txt-muted); font-size: 13px; text-align: center; }

    /* ─── CONCEPT BOX ────────────────────────────────────────────────── */
    .concept-box {
      padding: 14px;
      background: rgba(0,188,212,0.05);
      border-left: 3px solid var(--cyan);
      border-radius: 0 var(--radius) var(--radius) 0;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--txt-secondary);
    }

    .concept-box strong { color: var(--cyan); }

    /* ─── ALERT BOXES ────────────────────────────────────────────────── */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 12px;
      font-size: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .alert i { margin-top: 2px; flex-shrink: 0; }

    .alert-warning {
      background: rgba(243,156,18,0.08);
      border: 1px solid rgba(243,156,18,0.25);
      color: #e8b96a;
    }

    .alert-info {
      background: rgba(52,152,219,0.08);
      border: 1px solid rgba(52,152,219,0.25);
      color: #7ab8e0;
    }

    .alert-success {
      background: rgba(39,174,96,0.08);
      border: 1px solid rgba(39,174,96,0.25);
      color: #6dc99a;
    }

    /* ─── TABLE ──────────────────────────────────────────────────────── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .data-table th {
      background: var(--bg-elevated);
      color: var(--txt-secondary);
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--bg-elevated);
      color: var(--txt-secondary);
    }

    .data-table tr:last-child td { border-bottom: none; }

    .data-table tr:hover td { background: var(--bg-card); }

    .data-table code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--accent);
    }

    /* ─── NAV BUTTONS ────────────────────────────────────────────────── */
    .nav-btns {
      display: flex;
      justify-content: space-between;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--txt-secondary);
      font-size: 14px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Barlow', sans-serif;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .nav-btn.next {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 700;
      font-family: 'Exo 2', sans-serif;
    }

    .nav-btn.next:hover {
      background: var(--accent-dim);
      border-color: var(--accent-dim);
    }

    /* ─── RIGHT GLOSSARY ─────────────────────────────────────────────── */
    #glossary-panel {
      position: sticky;
      top: calc(var(--header-h) + 3px);
      height: calc(100vh - var(--header-h) - 3px);
      overflow-y: auto;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      padding: 16px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #glossary-panel::-webkit-scrollbar { width: 4px; }
    #glossary-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .glossary-title {
      font-family: 'Exo 2', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--txt-muted);
      padding: 0 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .glossary-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .glossary-empty {
      padding: 16px;
      color: var(--txt-muted);
      font-size: 13px;
      text-align: center;
    }

    .glossary-term {
      padding: 10px 16px;
      border-bottom: 1px solid var(--bg-elevated);
      cursor: help;
    }

    .glossary-term:last-child { border-bottom: none; }

    .gt-name {
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .gt-def {
      font-size: 12.5px;
      color: var(--txt-muted);
      line-height: 1.55;
    }

    /* ─── TOAST ──────────────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--txt-primary);
      font-size: 13.5px;
      box-shadow: var(--shadow);
      animation: slideIn 0.25s ease;
      min-width: 200px;
    }

    .toast.success { border-left: 3px solid var(--green); }

      font-weight: 700;
      font-size: 13px;
      color: var(--txt-primary);

      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 150;
    }

      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 16px 32px;

      align-items: center;

      font-size: 12px;
      color: var(--txt-muted);

    @media print {

      .section-header { page-break-after: avoid; }
    }

    @media (max-width: 1199px) {

    }

      pointer-events: none;

    }

</head>

// ═══════════════════════════════════════════════════════════════
// SAFE STORAGE — accès localStorage protégé (mode privé, cookies bloqués)
// Pourquoi : localStorage.getItem/setItem lève une exception si le stockage
// est désactivé ; sans garde, toute l'init SPA planterait.
// ═══════════════════════════════════════════════════════════════
const safeStorage = {
  get(key, fallback = null) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); return true; }
    catch (e) { return false; }
  }
};

// STATE
// ═══════════════════════════════════════════════════════════════
let currentSectionIndex = 0;
let visitedSections = new Set();
let searchTimeout = null;

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  // Restore theme (protégé si stockage indisponible)
  const theme = safeStorage.get('mk-theme', 'dark');
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);

  // Restore last section
  const lastSection = parseInt(safeStorage.get('mk-last-section', '0'), 10);
  currentSectionIndex = Math.min(isNaN(lastSection) ? 0 : lastSection, appData.sections.length - 1);

  // Restore visited
  try {
    const visited = JSON.parse(safeStorage.get('mk-visited', '[]'));
    visited.forEach(i => visitedSections.add(i));
  } catch(e) {}

  buildNav();
  renderSection(currentSectionIndex);
  setupSearch();

  // Mobile menu
  document.getElementById('mobile-menu-btn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);

  // Theme toggle
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  // Retour en haut (apparition au scroll du panneau central)
  const backTop = document.getElementById('back-to-top');
  const mainEl = document.getElementById('main');
  if (backTop && mainEl) {
    mainEl.addEventListener('scroll', () => {
      backTop.style.display = mainEl.scrollTop > 400 ? 'flex' : 'none';
    });
    backTop.addEventListener('click', () => { mainEl.scrollTop = 0; mainEl.focus && mainEl.focus(); });
  }

  // Echap global : ferme recherche + sidebar mobile
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSidebar(); }
  });
});

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function buildNav() {
  const list = document.getElementById('nav-list');
  list.innerHTML = '';

  appData.sections.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = `nav-item ${i === currentSectionIndex ? 'active' : ''} ${visitedSections.has(i) && i !== currentSectionIndex ? 'visited' : ''}`;
    item.setAttribute('data-index', i);
    item.setAttribute('role', 'button');
    item.setAttribute('tabindex', '0');
    item.setAttribute('aria-label', `Section ${s.step}: ${s.title}`);
    item.innerHTML = `
      <i class="nav-icon ${s.icon}"></i>
      <span style="flex:1;font-size:13px">${s.title}</span>
      <span class="nav-step">${s.step}</span>
    `;
    item.addEventListener('click', () => { navigateTo(i); closeSidebar(); });
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateTo(i); closeSidebar(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); const n = list.children[i + 1]; if (n) n.focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); const pr = list.children[i - 1]; if (pr) pr.focus(); }
    });
    list.appendChild(item);
  });
}

function navigateTo(index) {
  visitedSections.add(currentSectionIndex);
  currentSectionIndex = index;
  safeStorage.set('mk-last-section', String(index));

  safeStorage.set('mk-visited', JSON.stringify([...visitedSections]));

  buildNav();
  renderSection(index);
  document.getElementById('main').scrollTop = 0;
  updateProgress();
}

function updateProgress() {
  const pct = ((visitedSections.size) / appData.sections.length) * 100;
  document.getElementById('progress-bar').style.width = Math.min(pct, 100) + '%';
}

// RENDER SECTION
// ═══════════════════════════════════════════════════════════════
function renderSection(index) {
  const s = appData.sections[index];
  const area = document.getElementById('content-area');
  let html = '';

  // Section header
  html += `
    <div class="section-header">
      <div class="section-badge"><i class="${s.icon}"></i> Étape ${s.step}</div>
      <h1 class="section-title">${s.title}</h1>
      <p class="section-description">${s.description}</p>
    </div>
  `;

  // Alerts (before content)
  if (s.alerts) {
    s.alerts.forEach(a => {
      html += `<div class="alert alert-${a.type}"><i class="fa-solid ${a.icon}"></i><span>${a.text}</span></div>`;
    });
  }

  // Subsections (intro)
  if (s.subsections) {
    s.subsections.forEach(sub => {
      html += `<div class="card"><div class="card-header"><div class="card-header-icon icon-concept"><i class="fa-solid fa-circle-info"></i></div><span class="card-header-title">${sub.title}</span></div><div class="card-body">`;
      if (sub.content) html += `<p style="color:var(--txt-secondary);font-size:14px;line-height:1.7">${sub.content}</p>`;
      if (sub.table) html += renderTable(sub.table);
      html += `</div></div>`;
    });
  }

  // Concepts
  if (s.concepts && s.concepts.length > 0) {
    html += `<div class="card"><div class="card-header"><div class="card-header-icon icon-concept"><i class="fa-solid fa-lightbulb"></i></div><span class="card-header-title">Concepts Clés</span></div><div class="card-body">`;
    s.concepts.forEach(c => {
      html += `<div class="concept-box"><strong>${c.term}</strong> — ${c.def}</div>`;
    });
    html += `</div></div>`;
  }

  // CLI Commands
  if (s.cliCommands && s.cliCommands.length > 0) {
    html += `<div class="card"><div class="card-header"><div class="card-header-icon icon-cli"><i class="fa-solid fa-terminal"></i></div><span class="card-header-title" style="color:var(--green)">Commandes CLI — RouterOS</span></div><div class="card-body">`;
    s.cliCommands.forEach((cmd, ci) => {
      html += `
        <div class="cli-block">
          <pre class="cli-code"><code class="language-routeros" id="cli-${index}-${ci}">${escapeHtml(cmd)}</code></pre>
          <button class="cli-copy-btn" onclick="copyCommand('cli-${index}-${ci}',this)" title="Copier" aria-label="Copier la commande ${ci + 1} de la section ${escapeHtml(s.title)}">
            <i class="fa-regular fa-copy" aria-hidden="true"></i>
          </button>
        </div>
      `;
    });
    if (s.cliCommands.length > 1) {
      html += `<button class="cli-all-btn" onclick="copyAllCommands(${index})"><i class="fa-solid fa-copy"></i> Copier toutes les commandes</button>`;
    }
    html += `</div></div>`;
  }

  // WinBox Steps
  if (s.winboxSteps && s.winboxSteps.length > 0) {
    html += `<div class="card"><div class="card-header"><div class="card-header-icon icon-winbox"><i class="fa-solid fa-display"></i></div><span class="card-header-title" style="color:var(--blue)">Équivalent WinBox (GUI)</span></div><div class="card-body">`;
    html += `<ol class="winbox-steps">`;
    s.winboxSteps.forEach(step => {
      html += `<li>${step}</li>`;
    });
    html += `</ol></div></div>`;
  }

  // Diagram
  if (s.diagram) {
    html += `<div class="card"><div class="card-header"><div class="card-header-icon icon-diagram"><i class="fa-solid fa-diagram-project"></i></div><span class="card-header-title" style="color:var(--accent)">Schéma Réseau</span></div><div class="card-body">`;
    html += renderDiagram(s.diagram, s);
    html += `</div></div>`;
  }

  // Table (section-level)
  if (s.table) {
    html += `<div class="card"><div class="card-header"><div class="card-header-icon icon-concept"><i class="fa-solid fa-table"></i></div><span class="card-header-title">Récapitulatif</span></div><div class="card-body">`;
    html += renderTable(s.table);
    html += `</div></div>`;
  }

  // Navigation buttons
  html += `<div class="nav-btns">`;
  if (index > 0) {
    html += `<button class="nav-btn prev" onclick="navigateTo(${index-1})"><i class="fa-solid fa-arrow-left"></i> ${appData.sections[index-1].title}</button>`;
  } else {
    html += `<div></div>`;
  }
  if (index < appData.sections.length - 1) {
    html += `<button class="nav-btn next" onclick="navigateTo(${index+1})">Suivant : ${appData.sections[index+1].title} <i class="fa-solid fa-arrow-right"></i></button>`;
  } else {
    html += `<button class="nav-btn next" style="background:var(--green);border-color:var(--green)" onclick="showToast('🎉 Configuration complète !','success')"><i class="fa-solid fa-circle-check"></i> Terminé !</button>`;
  }
  html += `</div>`;

  area.innerHTML = html;
  updateGlossary(s.terminology || []);
  updateProgress();
  highlightCli();
}

// SVG helper functions
function svgBox(x, y, w, h, fill, stroke, text) {
  const lines = text.split('\n');
  const lineH = 14;
  const startY = y + h/2 - (lines.length * lineH)/2 + 10;
  let textSvg = lines.map((l, i) =>
    `<text x="${x+w/2}" y="${startY + i*lineH}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="white">${l}</text>`
  ).join('');
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>${textSvg}`;
}

function svgArrow(x1, y1, x2, y2, dashed = false) {
  const dashAttr = dashed ? 'stroke-dasharray="6,3"' : '';
  return `<defs><marker id="arr-g-${x1}-${x2}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/></marker></defs>
  <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#27ae60" stroke-width="2" ${dashAttr} marker-end="url(#arr-g-${x1}-${x2})"/>`;
}

function svgArrowRed(x1, y1, x2, y2) {
  return `<defs><marker id="arr-r-${x1}-${x2}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e74c3c"/></marker></defs>
  <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-r-${x1}-${x2})"/>`;
}

function svgLine(x1, y1, x2, y2) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3498db" stroke-width="1.5" opacity="0.6"/>`;
}

// TABLE RENDER
// ═══════════════════════════════════════════════════════════════
function renderTable(table) {
  let html = `<div style="overflow-x:auto"><table class="data-table"><thead><tr>`;
  table.headers.forEach(h => html += `<th>${h}</th>`);
  html += `</tr></thead><tbody>`;
  table.rows.forEach(row => {
    html += `<tr>`;
    row.forEach(cell => html += `<td>${cell}</td>`);
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function updateGlossary(terms) {
  const gc = document.getElementById('glossary-content');

    gc.innerHTML = `<div class="glossary-empty"><i class="fa-solid fa-book-open" style="font-size:24px;color:var(--txt-muted);display:block;margin-bottom:8px"></i>Sélectionnez une section pour voir le glossaire contextuel.</div>`;
    return;
  }

  let html = '';
  terms.forEach(term => {
    const def = glossaryData[term] || 'Définition à venir.';
    html += `<div class="glossary-term"><div class="gt-name">${term}</div><div class="gt-def">${def}</div></div>`;
  });
  gc.innerHTML = html;
}

// COPY COMMANDS
// ═══════════════════════════════════════════════════════════════
function copyCommand(id, btn) {
  const el = document.getElementById(id);
  const text = el ? el.textContent : '';
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = '<i class="fa-solid fa-check"></i>';
    btn.classList.add('copied');
    showToast('Commande copiée !', 'success');
    setTimeout(() => {
      btn.innerHTML = '<i class="fa-regular fa-copy" aria-hidden="true"></i>';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Commande copiée !', 'success');
  });
}

function copyAllCommands(sectionIndex) {
  const s = appData.sections[sectionIndex];
  const text = s.cliCommands.join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast(`${s.cliCommands.length} commandes copiées !`, 'success');
  });
}

// ═══════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════
function setupSearch() {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');

  input.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const q = sanitizeInput(e.target.value.trim());

    if (q.length < 2) {
      results.style.display = 'none';
      return;
    }

    searchTimeout = setTimeout(() => {
      const matches = searchContent(q);
      if (matches.length === 0) {
        results.innerHTML = `<div class="sr-item"><div class="sr-title" style="color:var(--txt-muted)">Aucun résultat pour "${q}"</div></div>`;
      } else {
        results.innerHTML = matches.map(m => `
          <div class="sr-item" onclick="navigateTo(${m.index}); document.getElementById('search-results').style.display='none'; document.getElementById('search-input').value='';">
            <div class="sr-title"><i class="${appData.sections[m.index].icon}" style="color:var(--accent);margin-right:6px;font-size:12px"></i>${m.title}</div>
            <div class="sr-snippet">${m.snippet}</div>
          </div>
        `).join('');
      }
      results.style.display = 'block';
    }, 200);
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !results.contains(e.target)) {
      results.style.display = 'none';
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      results.style.display = 'none';
      input.blur();
    }
  });
}

function escapeRegExp(str) {
  // Pourquoi : la requête utilisateur est injectée dans new RegExp() ;
  // sans échappement, des caractères comme [.*+ provoquent une erreur
  // ou un comportement inattendu (ReDoS / exception SyntaxError).
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function searchContent(query) {
  const q = query.toLowerCase();
  const qSafe = escapeRegExp(q);
  const results = [];

  appData.sections.forEach((s, i) => {
    const haystack = [
      s.title, s.description,
      ...(s.cliCommands || []),
      ...(s.winboxSteps || []),
      ...(s.terminology || []),
      ...(s.concepts ? s.concepts.map(c => c.term + ' ' + c.def) : [])
    ].join(' ').toLowerCase();

    if (haystack.includes(q)) {
      // Find snippet
      const idx = haystack.indexOf(q);
      const start = Math.max(0, idx - 40);
      const raw = haystack.substring(start, idx + q.length + 60);
      const snippet = '...' + escapeHtml(raw).replace(new RegExp(qSafe, 'gi'), m => `<mark>${m}</mark>`) + '...';
      results.push({ index: i, title: s.title, snippet });
    }
  });

  // Also search glossary
  Object.entries(glossaryData).forEach(([term, def]) => {
    if (term.toLowerCase().includes(q) || def.toLowerCase().includes(q)) {
      // Find which section uses this term
      appData.sections.forEach((s, i) => {
        if (s.terminology && s.terminology.includes(term)) {
          if (!results.find(r => r.index === i)) {
            results.push({ index: i, title: s.title + ` — ${term}`, snippet: def.substring(0, 80) + '...' });
          }
        }
      });
    }
  });

  return results.slice(0, 8);
}

function sanitizeInput(str) {
  return str.replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
}

// ═══════════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════════
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  safeStorage.set('mk-theme', next);
  updateThemeIcon(next);
  showToast(`Mode ${next === 'dark' ? 'sombre' : 'clair'} activé`, 'info');
}

function updateThemeIcon(theme) {
  const btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.innerHTML = theme === 'dark'
      ? '<i class="fa-solid fa-sun"></i>'
      : '<i class="fa-solid fa-moon"></i>';
  }
}

// ═══════════════════════════════════════════════════════════════
// MOBILE SIDEBAR
// ═══════════════════════════════════════════════════════════════
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════════
// TOAST NOTIFICATIONS
// ═══════════════════════════════════════════════════════════════
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-info';
  const color = type === 'success' ? 'var(--green)' : 'var(--blue)';
  toast.innerHTML = `<i class="fa-solid ${icon}" style="color:${color}"></i> ${message}`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.animation = 'fadeOut 0.3s ease forwards';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// ═══════════════════════════════════════════════════════════════
// PDF EXPORT
// ═══════════════════════════════════════════════════════════════
function buildExportHtml() {
  // Pourquoi : factorisé pour réutilisation popup ET fallback in-page.
  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>MikroTik Config Guide — CFP-CMD</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; color: #111; }
    h1 { color: #0B2B40; border-bottom: 3px solid #F39C12; padding-bottom: 10px; }
    h2 { color: #0B2B40; margin-top: 30px; border-left: 4px solid #F39C12; padding-left: 10px; page-break-before: always; }
    h2:first-of-type { page-break-before: auto; }
    pre { background: #1a2535; color: #abb2bf; padding: 14px; border-radius: 6px; overflow-x: auto; font-family: 'Courier New', monospace; font-size: 12px; page-break-inside: avoid; }
    .badge { background: #F39C12; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .section-desc { color: #555; margin-bottom: 16px; }
    .winbox-section { background: #f0f7ff; border-left: 3px solid #3498db; padding: 12px; margin: 16px 0; }
    .winbox-section h3 { color: #3498db; margin: 0 0 10px; font-size: 14px; }
    ol { padding-left: 20px; }
    li { margin-bottom: 6px; font-size: 13px; color: #444; }
    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #ddd; color: #999; font-size: 12px; text-align: center; }
    @media print { h2 { page-break-before: always; } }
  </style></head><body>
  <h1>MikroTik Configuration Guide</h1>
  <p style="color:#666">CFP-CMD — Centre de Formation Professionnelle Commerce et du Monde Digital<br>
  Généré le : ${new Date().toLocaleDateString('fr-FR', {year:'numeric',month:'long',day:'numeric'})}</p>
  <hr>`;

  appData.sections.forEach((s, i) => {
    if (s.cliCommands && s.cliCommands.length === 0 && !s.subsections) return;
    html += `<h2><span class="badge">Étape ${escapeHtml(s.step)}</span> ${escapeHtml(s.title)}</h2>`;
    html += `<p class="section-desc">${escapeHtml(s.description)}</p>`;

    if (s.cliCommands && s.cliCommands.length > 0) {
      html += `<h3>Commandes CLI RouterOS</h3>`;
      s.cliCommands.forEach(cmd => {
        html += `<pre>${escapeHtml(cmd)}</pre>`;
      });
    }

    if (s.winboxSteps && s.winboxSteps.length > 0) {
      html += `<div class="winbox-section"><h3>Équivalent WinBox</h3><ol>`;
      s.winboxSteps.forEach(step => {
        html += `<li>${escapeHtml(step.replace(/<[^>]*>/g, ''))}</li>`;
      });
      html += `</ol></div>`;
    }
  });

  html += `<div class="footer">MikroTik Interactive Guide — CFP-CMD v1.1 — MASTER NMA</div></body></html>`;
  return html;
}

function exportPDF() {
  // Pourquoi : window.open() est bloqué par les bloqueurs de popup ;
  // sans fallback, le bouton semble ne rien faire. On bascule alors sur
  // l'impression de la page courante (styles @media print déjà prévus).
  let printWin = null;
  try { printWin = window.open('', '_blank'); } catch (e) { printWin = null; }

  if (!printWin) {
    showToast('Popup bloquée — utilisez le dialogue d\u2019impression du navigateur (Ctrl+P)', 'info');
    window.print();
    return;
  }

  printWin.document.write(buildExportHtml());
  printWin.document.close();
  printWin.focus();
  setTimeout(() => {
    printWin.print();
  }, 500);

  showToast('Génération PDF en cours...', 'info');
}

// ═══════════════════════════════════════════════════════════════
// HIGHLIGHT CLI — coloration syntaxique des blocs RouterOS
// ═══════════════════════════════════════════════════════════════
function highlightCli() {
  // Pourquoi : la lib Highlight.js etait chargee mais jamais appelee ;
  // sans cet appel, ~30 Ko de JS restaient inutiles. Fallback silencieux
  // si le CDN est indisponible (mode offline).
  try {
    if (window.hljs) {
      document.querySelectorAll('pre.cli-code code').forEach((el) => {
        try { hljs.highlightElement(el); } catch (e) { /* bloc suivant */ }
      });
    }
  } catch (e) { /* highlight optionnel */ }
}

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
